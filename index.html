<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>競馬予想ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 1列のアプリ。上に日付とタブ（予想／貼り付け／成績）。予想はレース一覧→開くと出走表と買い目づくり */
:root {
  --bg: #f3f5f1; --card: #ffffff; --fg: #1b231d; --muted: #5d6a60; --line: #d9dfd6; --soft: #e8ece5;
  --accent: #2f6b3f; --accent-fg: #ffffff; --calm: #2f6b3f; --rough: #b0442c; --hit: #b0442c; --sel: #fbe7a6; --sel-fg: #1b231d;
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121713; --card: #1a211c; --fg: #e6ece6; --muted: #9aa79d; --line: #2c362f; --soft: #242d27;
  --accent: #7cc28f; --accent-fg: #102014; --calm: #7cc28f; --rough: #f08a70; --hit: #f08a70; --sel: #6b5a1c; --sel-fg: #fff6d8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121713; --card: #1a211c; --fg: #e6ece6; --muted: #9aa79d; --line: #2c362f; --soft: #242d27;
  --accent: #7cc28f; --accent-fg: #102014; --calm: #7cc28f; --rough: #f08a70; --hit: #f08a70; --sel: #6b5a1c; --sel-fg: #fff6d8; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.55; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 14px 64px; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-size: 1.45rem; margin: 0; }
h2 { font-family: var(--display); font-size: 1.15rem; margin: 6px 0 0; }
h3 { margin: 0; font-size: 1.05rem; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
select, input, textarea, button { font: inherit; color: var(--fg); }
select, input[type=number], textarea { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
textarea { width: 100%; min-height: 12rem; box-sizing: border-box; font-size: .82rem; }
button { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 6px; z-index: 3; }
.tabs button { flex: 1; border-radius: 8px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.note { font-size: .8rem; color: var(--muted); margin: 0; }
.status { font-size: .8rem; color: var(--muted); }
.list { display: grid; gap: 8px; }
.rc { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; cursor: pointer; text-align: left; }
.rc:hover { border-color: var(--accent); }
.rc .l1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rc .t { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.rc .nm { font-weight: 700; }
.rc .sub { font-size: .78rem; color: var(--muted); }
.rc .l2 { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: .82rem; }
.tag { font-size: .72rem; font-weight: 700; padding: 0 8px; border-radius: 99px; border: 1.5px solid currentColor; }
.tag.calm { color: var(--calm); } .tag.rough { color: var(--rough); } .tag.mute { color: var(--muted); }
.mine { font-size: .78rem; font-weight: 700; }
.mine.hit { color: var(--hit); }
.num { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; border-radius: 4px; font-weight: 700; font-size: .8rem; font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; font-size: .8rem; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 5px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td.r, th.r { text-align: right; }
td.nmc small { display: block; color: var(--muted); font-size: .7rem; }
.res1 { font-weight: 700; color: var(--hit); }
.builder { display: grid; gap: 8px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.row { display: grid; gap: 4px; }
.row .lab { font-size: .78rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px 3px 3px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: .8rem; }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--sel-fg); border-color: var(--sel); font-weight: 700; }
.chip small { color: inherit; opacity: .75; font-size: .68rem; }
.quick { display: flex; gap: 5px; flex-wrap: wrap; }
.quick button { font-size: .78rem; padding: 4px 9px; }
.sum { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.sum b { font-size: 1.05rem; }
.shape { font-size: 1.02rem; font-weight: 700; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; line-height: 1.7; overflow-wrap: anywhere; }
.shape .k { color: var(--muted); font-weight: 500; font-size: .8rem; margin-right: 4px; }
.kshape { font-size: .8rem; }
.leak { color: var(--rough); font-size: .78rem; }
details.cl summary { cursor: pointer; font-size: .8rem; color: var(--muted); }
.combos { font-size: .76rem; color: var(--muted); max-height: 7rem; overflow: auto; background: var(--soft); border-radius: 6px; padding: 6px 8px; word-break: break-all; }
.bets { display: grid; gap: 6px; }
.bet { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .82rem; }
.bet .d { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.bet button { font-size: .74rem; padding: 2px 8px; }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 8px; }
.kpi div { border-top: 2px solid var(--line); padding-top: 6px; }
.kpi div.me { border-top-color: var(--accent); }
.kpi dt { font-size: .74rem; color: var(--muted); }
.kpi dd { margin: 0; font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi dd small { display: block; font-size: .72rem; font-weight: 400; color: var(--muted); }
.warn { color: var(--rough); font-size: .8rem; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; font-size: .9rem; }
.back { justify-self: start; }
/* スマホで片手: 押す所は 40px 以上。一覧は左に大きい％、レースは馬の行の右で選ぶ */
button { min-height: 40px; }
.rc { grid-template-columns: 3.3rem minmax(0, 1fr); column-gap: 10px; align-items: center; min-height: 0; }
.rc .bd { display: grid; gap: 3px; min-width: 0; }
.rc.done { opacity: .55; }
.rc.next { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.pc { display: grid; place-items: center; align-content: center; width: 3.3rem; height: 3.3rem; border-radius: 10px; background: var(--soft); line-height: 1; font-variant-numeric: tabular-nums; flex: none; }
.pc b { font-size: 1.45rem; } .pc small { font-size: .68rem; }
.pc.word { font-size: .82rem; font-weight: 700; }
.pc.rough { color: var(--accent-fg); background: var(--rough); } .pc.calm { color: var(--calm); } .pc.mute { color: var(--fg); }
.tag.nx { color: var(--accent); }
.rc .l2 { flex-wrap: nowrap; gap: 3px; font-size: .76rem; overflow: hidden; }
.mkn { display: inline-flex; align-items: center; flex: none; }
.today .seg button, .pickb { min-height: 40px; }
.pickb { text-align: left; } .pickb b { color: var(--rough); } .pickb small { color: var(--muted); }
.nav { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.navs { display: flex; gap: 6px; }
.rh { display: flex; gap: 10px; align-items: center; }
.pick { display: grid; }
.hr { display: grid; grid-template-columns: 1.7rem minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.hr.in { background: var(--soft); }
.hr.hd { font-size: .72rem; color: var(--muted); padding-bottom: 2px; }
.hn { min-width: 0; display: grid; }
.hn .h1 { font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hn small { color: var(--muted); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.mk { margin-right: 2px; }
.pks { display: flex; gap: 5px; }
.pk, .pkh { width: 42px; box-sizing: border-box; }
.pk { height: 42px; padding: 0; border-radius: 8px; background: var(--card); color: var(--line); font-weight: 700; font-size: 1rem; }
.pk[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.pkh { display: grid; text-align: center; line-height: 1.25; }
.sum .seg button { min-width: 3rem; padding-inline: 6px; }
.bar { position: sticky; bottom: 0; z-index: 2; display: flex; gap: 8px; align-items: center; background: var(--card); border-top: 1px solid var(--line); margin: 0 -12px -12px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); border-radius: 0 0 12px 12px; }
.bar .bt { flex: 1; min-width: 0; display: grid; font-variant-numeric: tabular-nums; }
.bar .bt b { font-size: 1.05rem; }
.bar button.primary { padding-inline: 18px; }
.more { display: grid; gap: 8px; margin-top: 8px; }
.builder .seg button, .builder .quick button { min-height: 36px; padding: 4px 10px; font-size: .86rem; }
.builder .quick { align-items: center; }
.setup { display: grid; gap: 8px; }
.setup input[type=text], .setup input[type=password] { background: var(--card); border: 2px solid var(--muted); font-size: 16px; min-height: 44px; border-radius: 8px; padding: 6px 8px; width: 100%; box-sizing: border-box; }
.qr { background: #fff; padding: 10px; border-radius: 8px; justify-self: start; }
.qr svg { display: block; width: 220px; height: 220px; }
.top .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>競馬予想ノート</h1>
    <div class="acts"><label class="status">日付 <select id="day" aria-label="日付"></select></label><button id="setbtn">設定・QR</button></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-yoso" aria-selected="true">予想</button>
    <button role="tab" id="tab-paste" aria-selected="false">貼り付け</button>
    <button role="tab" id="tab-seiseki" aria-selected="false">成績</button>
  </nav>
  <p id="dbstate" class="note">データの置き場所につないでいます…</p>
  <section id="v-yoso"></section>
  <section id="v-paste" hidden></section>
  <section id="v-seiseki" hidden></section>
  <section id="v-setup" hidden></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
"use strict";
const WAKU = ["#ffffff","#1d1d1d","#d8262b","#2059b5","#f1d02c","#2a8a3e","#ef8a1f","#f29bb6"];
const WAKU_FG = ["#1d1d1d","#ffffff","#ffffff","#ffffff","#1d1d1d","#ffffff","#1d1d1d","#1d1d1d"];
const MK = "◎○▲△△☆";
const PAYKEY = {"3連複":"Fuku3","3連単":"Tan3","馬連":"Umaren","ワイド":"Wide","単勝":"Tansho","複勝":"Fukusho"};
const UNORDERED = new Set(["3連複","馬連","ワイド","枠連"]);
const S = { days: [], day: null, data: null, cache: {}, open: null, tab: "yoso", bets: [], db: null, dbOk: false,
            b: { kind: "3連複", way: "form", cols: [[],[],[]], box: [], unit: 100 }, parsed: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => (n ?? 0).toLocaleString("ja-JP") + "円";
const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "-";

function wakuOf(num, heads) {
  if (heads <= 8) return num;
  const size = Array(8).fill(1); let extra = heads - 8, i = 7;
  while (extra > 0) { size[i]++; extra--; i = i > 0 ? i - 1 : 7; }
  let acc = 0; for (let w = 0; w < 8; w++) { acc += size[w]; if (num <= acc) return w + 1; } return 8;
}
function chipNum(num, heads) { const w = wakuOf(num, heads) - 1; return `<span class="num" style="background:${WAKU[w]};color:${WAKU_FG[w]}">${num}</span>`; }

// ---- データの置き場所: GitHub の非公開リポジトリ ----
// days/index.json・days/<日付>.json（予想。PC の Python が push する）と bets/<日付>.json（買い目の記録。このアプリが書く）
// 鍵（fine-grained token、そのリポジトリの Contents 読み書きだけ）は端末ごとに1回入れる。端末の中（localStorage）にだけ置く
const CFG_KEY = "keiba.gh";
function cfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch { return null; } }
function setCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch {} }
function b64dec(b) { const bin = atob(b.replace(/\n/g, "")); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
function b64enc(t) { const u = new TextEncoder().encode(t); let bin = ""; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(bin); }
async function gh(path, opt = {}) {
  const c = cfg(); if (!c?.token) throw Object.assign(new Error("no token"), { code: "未設定" });
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`, { ...opt, cache: "no-store",
    headers: { Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opt.headers || {}) } });
  if (r.status === 404) return null;
  if (!r.ok) throw Object.assign(new Error("github " + r.status), { status: r.status,
    code: r.status === 401 ? "鍵が違う・期限切れ" : r.status === 403 ? "権限が足りない" : "GitHub " + r.status });
  return r.json();
}
async function ghRead(path) {   // {data, sha}。1MB を超えるファイルは raw で取り直す
  const j = await gh(path); if (!j) return null;
  if (j.content) return { data: JSON.parse(b64dec(j.content)), sha: j.sha };
  return { data: await gh(path, { headers: { Accept: "application/vnd.github.raw+json" } }), sha: j.sha };
}
async function ghWrite(path, data, sha, msg) {
  return gh(path, { method: "PUT", body: JSON.stringify({ message: msg, content: b64enc(JSON.stringify(data, null, 1)), ...(sha ? { sha } : {}) }) });
}
async function getDay(ds) {
  if (!S.cache[ds]) { try { S.cache[ds] = (await ghRead(`days/${ds}.json`))?.data ?? null; } catch { return null; } }   // 読めなかった時は覚えず、次にまた取りに行く
  return S.cache[ds];
}
async function loadDays() {
  try { const x = await ghRead("days/index.json"); S.days = x?.data ?? []; if (!x) alertMsg("予想が見つかりません。設定・QR で持ち主・リポジトリ名を確かめてください。"); }
  catch (e) { S.days = []; alertMsg("予想を読めませんでした（" + (e.code || e.message) + "）。設定・QR で鍵を確かめてください。"); }
  const sel = $("day");
  sel.innerHTML = S.days.slice().reverse().map(d => `<option value="${d}">${d}</option>`).join("");
  let want = null; try { want = localStorage.getItem("keiba.day"); } catch {}
  S.day = S.days.includes(want) ? want : S.days[S.days.length - 1];
  sel.value = S.day || "";
  await loadDay(S.day);
}
async function loadDay(ds) {
  if (!ds) { S.data = null; render(); return; }
  S.data = await getDay(ds); S.open = null; render();
}
$("day").addEventListener("change", e => { S.day = e.target.value; try { localStorage.setItem("keiba.day", S.day); } catch {} loadDay(S.day); });

// ---- 記録（bets/<日付>.json に配列で。書く時は sha を付け、他の端末が先に書いていたら読み直してやり直す） ----
async function loadBets() {
  try {
    const files = ((await gh("bets")) || []).filter(f => f.name.endsWith(".json"));
    const all = await Promise.all(files.map(f => ghRead(`bets/${f.name}`).then(x => x?.data || [])));
    S.bets = all.flat(); S.dbOk = true; $("dbstate").hidden = true; render();
  } catch (e) { alertMsg("記録を読めませんでした（" + (e.code || e.message) + "）"); }
}
async function editBets(ds, fn) {
  for (let i = 0; i < 4; i++) {
    const cur = await ghRead(`bets/${ds}.json`);
    try { await ghWrite(`bets/${ds}.json`, fn(cur?.data || []), cur?.sha, `bets ${ds}`); return; }
    catch (e) { if (e.status !== 409 && e.status !== 422) throw e; }
  }
  throw Object.assign(new Error("conflict"), { code: "書き込みがぶつかりました。もう一度押してください" });
}
async function saveBet(doc) {
  try {
    const bet = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), ...doc };
    await editBets(doc.ds, arr => [...arr, bet]); S.bets.push(bet); render(); return true;
  } catch (e) { alertMsg("保存できませんでした（" + (e.code || e.message) + "）"); return false; }
}
async function delBet(id) {
  const b = S.bets.find(x => x.id === id); if (!b) return;
  try { await editBets(b.ds, arr => arr.filter(x => x.id !== id)); S.bets = S.bets.filter(x => x.id !== id); render(); }
  catch (e) { alertMsg("消せませんでした（" + (e.code || e.message) + "）"); }
}
function alertMsg(t) { const el = $("dbstate"); el.hidden = false; el.textContent = t; }

// ---- 設定・QR（スマホで開く） ----
function renderSetup() {
  const c = cfg() || {}; const url = location.origin + location.pathname;
  let qr = "";
  try { const q = qrcode(0, "M"); q.addData(url); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch {}
  $("v-setup").innerHTML = `<div class="panel setup">
    <h2>スマホで開く</h2>
    <div class="qr">${qr}</div>
    <p class="note">スマホのカメラでこの QR を読むとアプリが開きます（${esc(url)}）。開いたら共有メニューの「ホーム画面に追加」でアプリとして使えます。PC では Edge / Chrome のアドレス欄の「アプリをインストール」でデスクトップアプリになります。</p>
    <p class="note">この QR に鍵は入っていません。スマホで開いたら、下の「つないだ端末から鍵を受け取る」で鍵を読み取ります。</p>
  </div>
  ${c.token ? `<div class="panel setup">
    <h2>スマホに鍵を渡す</h2>
    <p class="note">スマホのアプリで「PCの鍵のQRを読む」を押してから、下のボタンで鍵の QR を出して読ませてください。<b>この QR は鍵そのものです。人に見せたり写真を残したりしないでください。</b>読み終わったら隠してください。</p>
    <div class="quick"><button id="kq-show">鍵の QR を出す</button></div>
    <div class="qr" id="kq" hidden></div>
  </div>` : ""}
  <div class="panel setup">
    <h2>つないだ端末から鍵を受け取る</h2>
    <p class="note">もう一方の端末（PC）で「鍵の QR を出す」を押し、ここでその QR を読みます。手で打つ必要はありません。</p>
    <div class="quick"><button class="primary" id="kq-scan">PCの鍵のQRを読む</button><button id="kq-stop" hidden>やめる</button><span class="status" id="kq-msg"></span></div>
    <video id="kq-video" playsinline muted hidden style="width:100%;max-width:320px;border-radius:8px"></video>
  </div>
  <div class="panel setup">
    <h2>データの置き場所（GitHub の非公開リポジトリ）</h2>
    <label class="note">持ち主（GitHub のユーザー名）<input type="text" id="cf-owner" value="${esc(c.owner || "akaobaotian-lab")}" autocomplete="off" autocapitalize="off"></label>
    <label class="note">リポジトリ名<input type="text" id="cf-repo" value="${esc(c.repo || "keiba-data")}" autocomplete="off" autocapitalize="off"></label>
    <label class="note">鍵（fine-grained token。この端末の中にだけ保存）<input type="password" id="cf-token" value="${esc(c.token || "")}" autocomplete="off" placeholder="ここに github_pat_… を貼り付け"></label>
    <div class="quick"><button class="primary" id="cf-save">保存してつなぐ</button><button id="cf-back">戻る</button><span class="status" id="cf-msg"></span></div>
  </div>`;
  $("cf-save").onclick = async () => {
    // 全角の英数字は半角に、空白・見えない文字・改行は取り除く（日本語入力のまま貼った・コピーで余計な物が付いた時）
    const clean = v => v.normalize("NFKC").replace(/[\s​-‍﻿]/g, "");
    const token = clean($("cf-token").value);
    if (!/^(github_pat_|ghp_)[A-Za-z0-9_]+$/.test(token)) {
      $("cf-msg").textContent = /[^\x20-\x7E]/.test(token) ? "鍵に英数字以外の文字が入っています。GitHub の画面のコピーボタンでコピーし直して、そのまま貼り付けてください"
        : "鍵は github_pat_ で始まる英数字です。GitHub の画面のコピーボタンでコピーし直して貼り付けてください";
      return;
    }
    $("cf-token").value = token;
    setCfg({ owner: clean($("cf-owner").value), repo: clean($("cf-repo").value), token });
    $("cf-msg").textContent = "つないでいます…"; S.cache = {};
    try {
      const t = await gh("days/index.json");
      if (!t) { $("cf-msg").textContent = "予想のファイルが見つかりません（持ち主・リポジトリ名を確かめてください）"; return; }
      $("cf-msg").textContent = "つながりました"; S.tab = "yoso"; await loadDays(); await loadBets();
    } catch (e) { $("cf-msg").textContent = "つながりません（" + (e.code || e.message) + "）"; }
  };
  $("cf-back").onclick = () => { S.tab = "yoso"; render(); };
  // 鍵の受け渡し: QR の中身は "keiba-gh:" + {o,r,t}。URL にはしない（履歴やサーバーに鍵が残らないように）
  const ks = $("kq-show");
  if (ks) ks.onclick = () => {
    const box = $("kq");
    if (!box.hidden) { box.hidden = true; box.innerHTML = ""; ks.textContent = "鍵の QR を出す"; return; }
    const q = qrcode(0, "L"); q.addData("keiba-gh:" + JSON.stringify({ o: c.owner, r: c.repo, t: c.token })); q.make();
    box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); box.hidden = false; ks.textContent = "鍵の QR を隠す";
    setTimeout(() => { if (!box.hidden) ks.click(); }, 120000);   // 出しっぱなしにしない（2分で隠す）
  };
  let stream = null, timer = null;
  const stop = () => { if (timer) clearInterval(timer); timer = null; stream?.getTracks().forEach(t => t.stop()); stream = null; $("kq-video").hidden = true; $("kq-stop").hidden = true; };
  $("kq-stop").onclick = () => { stop(); $("kq-msg").textContent = ""; };
  $("kq-scan").onclick = async () => {
    const v = $("kq-video"), msg = $("kq-msg");
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); }
    catch { msg.textContent = "カメラを使えませんでした。ブラウザの設定でカメラを許可してください"; return; }
    v.srcObject = stream; v.hidden = false; $("kq-stop").hidden = false; await v.play(); msg.textContent = "PC の画面の鍵の QR を映してください";
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
    const det = "BarcodeDetector" in window ? new BarcodeDetector({ formats: ["qr_code"] }) : null;
    timer = setInterval(async () => {
      if (!v.videoWidth) return;
      let text = null;
      try {
        if (det) { const r = await det.detect(v); text = r[0]?.rawValue || null; }
        else if (window.jsQR) { cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v, 0, 0); const d = cx.getImageData(0, 0, cv.width, cv.height); text = jsQR(d.data, d.width, d.height)?.data || null; }
      } catch {}
      if (!text) return;
      if (!text.startsWith("keiba-gh:")) { msg.textContent = "鍵の QR ではありません（PC で「鍵の QR を出す」を押した方を映してください）"; return; }
      stop();
      try { const x = JSON.parse(text.slice(9)); $("cf-owner").value = x.o; $("cf-repo").value = x.r; $("cf-token").value = x.t; msg.textContent = "鍵を受け取りました。つないでいます…"; $("cf-save").click(); }
      catch { msg.textContent = "読み取りに失敗しました。もう一度読んでください"; }
    }, 300);
  };
}

// ---- 払戻の計算 ----
function key(kind, c) { return (UNORDERED.has(kind) ? [...c].sort((a, b) => a - b) : c).join("-"); }
function payOf(race, kind, c) {
  const res = race?.result; if (!res) return null;
  const k = PAYKEY[kind]; if (!k) return null;
  const list = res.pay[k] || []; const want = key(kind, c);
  return list.filter(([cc]) => key(kind, cc) === want).reduce((s, [, y]) => s + y, 0);
}
function betReturn(race, bet) {
  if (!race?.result) return null;
  let r = 0, known = true;
  for (const it of bet.items) { const p = payOf(race, bet.kind, it.c); if (p === null) { known = false; break; } r += p * it.u / 100; }
  if (!known) return bet.pastedPay ?? null;
  return r;
}
function findRace(date, race) { const d = S.cache[date]; return d ? d.races.find(x => `${x.place}${x.r}R` === race) : null; }

// ---- 買い目づくり ----
function combosOf(b) {
  const need = b.kind === "3連複" || b.kind === "3連単" ? 3 : (b.kind === "単勝" || b.kind === "複勝") ? 1 : 2;
  const set = new Map();
  const push = c => { if (new Set(c).size !== c.length) return; const k = key(b.kind, c); if (!set.has(k)) set.set(k, UNORDERED.has(b.kind) ? [...c].sort((x, y) => x - y) : c); };
  if (b.way === "box") {
    const ns = [...b.box].sort((x, y) => x - y);
    const rec = (start, cur) => { if (cur.length === need) { push(cur); return; } for (let i = start; i < ns.length; i++) rec(i + 1, [...cur, ns[i]]); };
    if (UNORDERED.has(b.kind) || need === 1) rec(0, []);
    else { const perm = cur => { if (cur.length === need) { push(cur); return; } for (const n of ns) if (!cur.includes(n)) perm([...cur, n]); }; perm([]); }
  } else {
    const cols = b.cols.slice(0, need);
    const rec = (i, cur) => { if (i === need) { push(cur); return; } for (const n of cols[i]) rec(i + 1, [...cur, n]); };
    if (cols.every(c => c.length)) rec(0, []);
  }
  return [...set.values()];
}
function popOrder(race) {
  const res = race.result;
  const hs = race.horses.filter(h => !h.cancel && (res ? res.odds[h.num] : h.odds));
  return hs.sort((a, b) => ((res ? res.odds[a.num] : a.odds) - (res ? res.odds[b.num] : b.odds)) || a.num - b.num).map(h => h.num);
}
function morningPop(race) {
  return race.horses.filter(h => !h.cancel && h.odds).sort((a, b) => (a.odds - b.odds) || a.num - b.num).map(h => h.num);
}
// 作業1の買い方（人気の範囲）を、朝のオッズの人気順で馬番の形にする
function kaikataShape(race) {
  const j = race.judge_morning; if (!j) return null;
  const pop = j.order || morningPop(race);   // ノートと同じ人気順（朝オッズを取った時刻の順）
  const m = j.buy.match(/人気(\d+)〜(\d+) ボックス/);
  if (m) return { kind: "3連複", way: "box", box: pop.slice(+m[1] - 1, +m[2]), cols: [[], [], []] };
  const f = j.buy.match(/1〜(\d+)／1〜(\d+)／1〜(\d+)/);
  return f ? { kind: "3連複", way: "form", cols: [pop.slice(0, +f[1]), pop.slice(0, +f[2]), pop.slice(0, +f[3])], box: [] } : null;
}
function needOf(kind) { return kind === "3連複" || kind === "3連単" ? 3 : (kind === "単勝" || kind === "複勝") ? 1 : 2; }
// 投票サイトにそのまま入れる形
function shapeParts(b) {
  const need = needOf(b.kind);
  if (b.way === "box") return [["ボックス", [...b.box].sort((x, y) => x - y)]];
  const lab = i => need === 1 ? "馬" : (i + 1) + (b.kind === "3連単" || b.kind === "馬単" ? "着" : "頭目");
  return b.cols.slice(0, need).map((c, i) => [lab(i), [...c].sort((x, y) => x - y)]);
}
function shapeText(b) {
  const head = `${b.kind} ${b.way === "box" ? "ボックス" : "フォーメーション"} `;
  return head + shapeParts(b).map(([k, ns]) => (k === "ボックス" ? "" : k + " ") + ns.join("・")).join("／");
}
function shapeHtml(b) {
  return `<span class="k">${esc(b.kind)} ${b.way === "box" ? "ボックス" : "フォーメーション"}</span>` +
    shapeParts(b).map(([k, ns]) => (k === "ボックス" ? "" : `<span class="k">${k}</span>`) + ns.join("・")).join("　");
}
function quickFill(race, what) {
  const b = S.b; const pop = popOrder(race); const mk = race.mark || pop;
  if (what !== "keshi") b.kind = "3連複";
  if (what === "kaikata") { const k = kaikataShape(race); if (!k) return; b.way = k.way; b.box = k.box; b.cols = k.cols; }
  if (what === "mark6") { b.way = "box"; b.box = mk.slice(0, 6); }
  if (what === "mark10") { b.way = "box"; b.box = mk.slice(0, 10); }
  if (what === "keshi") { const ks = keshiNums(race, pop); b.box = b.box.filter(n => !ks.includes(n)); b.cols = b.cols.map(c => c.filter(n => !ks.includes(n))); return; }
  if (what === "mark3") { b.way = "form"; b.cols = [mk.slice(0, 3), mk.slice(0, 6), [...new Set([...mk.slice(0, 3), ...pop.slice(0, 10)])]]; }
  if (what === "clear") { b.cols = [[], [], []]; b.box = []; }
}

// ---- 比べ（人気版・印版・モデル版・作業1） ----
function compare(race, bets) {
  const f3 = bets.filter(b => b.kind === "3連複").flatMap(b => b.items);
  if (!f3.length || !race?.result) return null;
  const pop = popOrder(race);
  const use = new Map(); for (const it of f3) for (const n of it.c) use.set(n, (use.get(n) || 0) + it.u);
  const order = [...use.keys()].sort((a, b) => (use.get(b) - use.get(a)) || (pop.indexOf(a) - pop.indexOf(b)));
  const cost = f3.reduce((s, it) => s + it.u, 0);
  const ret = items => items.reduce((s, it) => s + (payOf(race, "3連複", it.c) || 0) * it.u / 100, 0);
  const mapped = target => { if (!target || target.length < order.length) return null; const m = new Map(order.map((n, i) => [n, target[i]])); return ret(f3.map(it => ({ c: it.c.map(n => m.get(n)), u: it.u }))); };
  const full = arr => arr ? [...arr, ...pop.filter(n => !arr.includes(n))] : null;
  const top3 = race.result.top3;
  const j = race.judge_final;
  return { cost, me: ret(f3), pop: mapped(pop), mark: race.mark ? mapped(full(race.mark)) : null, model: race.model ? mapped(full(race.model)) : null,
           k: j ? { cost: j.combos.length * 100, ret: ret(j.combos.map(c => ({ c, u: 100 }))) } : null,
           picks: order.slice(0, 3), picksIn: order.slice(0, 3).filter(n => top3.includes(n)).length,
           pop3In: pop.slice(0, 3).filter(n => top3.includes(n)).length,
           mark3In: race.mark ? race.mark.slice(0, 3).filter(n => top3.includes(n)).length : null };
}

// 三連複1万円以上になる確率（％はそのまま読める。1勝クラス以上の平均は36%）。発走前は今のオッズ、レース後は確定オッズでの値も出す
function p10kTag(race) {
  const p = race.p10k ?? race.p10k_final; if (p == null) return "";
  const c = p >= 0.6 ? "rough" : p < 0.3 ? "calm" : "mute";
  const fin = race.p10k != null && race.p10k_final != null ? `（確定オッズで ${Math.round(race.p10k_final * 100)}%）` : race.p10k == null ? "（確定オッズ）" : "";
  return `<span class="tag ${c}" title="三連複が1万円以上になる確率。1勝クラス以上の平均は36%">1万円以上 ${Math.round(p * 100)}%${fin}</span>`;
}
function judgeTag(race) {
  const j = race.judge_morning; if (race.debut) return `<span class="tag mute">新馬</span>`;
  if (race.p10k != null || race.p10k_final != null) return p10kTag(race);
  if (!j) return "";
  return `<span class="tag ${j.label === "荒れる" ? "rough" : "calm"}" title="荒れる確率 ${Math.round(j.p * 100)}%${j.src === "now" ? "（今のオッズで判定・境目 " + Math.round(j.th * 100) + "%）" : j.src === "are" ? "（オッズを使わない判定・境目 " + Math.round(j.th * 100) + "%）" : "（朝オッズ）・この日" + (j.of ?? "") + "R中" + (j.rank ?? "") + "位"}">${j.label}${j.rank ? " " + j.rank + "位" : ""}</span>`;
}
// 条件の近い過去レース（arekata）で、人気上位6頭だけで決まった割合を平均と比べる。
// 平均は同じ頭数帯の1勝クラス以上（2022〜2026-09）で人気上位6頭だけで決まった割合。頭数で大きく違う
function calmAvg(heads) { return heads <= 10 ? 74 : heads <= 13 ? 51 : heads <= 15 ? 40 : 36; }
function areText(race) {
  const a = race.are; if (!a || a.b6 == null || a.n == null) return "";
  const b6 = +a.b6, n = +a.n, avg = calmAvg(race.heads);
  const head = `過去の似たレース（${esc(a.cond.replace(/（.*$/, ""))}）${n}R: 人気上位6頭だけで決まったのは ${b6}%（${race.heads}頭立ての平均 ${avg}%）`;
  if (n < 15) return head + " → 件数が少なく判断できない";
  const gap = b6 - avg;   // 数十Rだと10ポイント程度は偶然でも出るので、それ未満は差と見ない
  if (Math.abs(gap) < 10) return head + ` → 平均と変わらない（差 ${gap >= 0 ? "+" : ""}${gap}）`;
  return head + " → " + (gap < 0 ? `<b style="color:var(--rough)">平均より荒れやすい（${gap}）</b>` : `<b style="color:var(--calm)">平均より堅い（+${gap}）</b>`);
}
// 消し: 7番人気以下で、理由の印の点数（良い印の数−悪い印の数）が−3以下の馬。過去の確かめ（2025-01〜2026-10、1勝クラス以上・10頭以上）で3着内 2.9%・複勝回収 43%（7番人気以下の全体は 8.7%・69%）
function keshiNums(race, pop) {
  pop = pop || popOrder(race);
  return race.horses.filter(h => !h.cancel && h.cnt != null && h.cnt <= -3 && pop.indexOf(h.num) + 1 >= 7).map(h => h.num).sort((a, b) => a - b);
}
function myBets(race) { return S.bets.filter(b => b.ds === S.data.ds && b.race === `${race.place}${race.r}R`); }

function postMin(r) { return +r.post.slice(0, 2) * 60 + +r.post.slice(3, 5); }
function clock() { const d = new Date(); const p = n => String(n).padStart(2, "0"); return { ds: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`, hm: d.getHours() * 60 + d.getMinutes() }; }
function untilText(m) { return m < 60 ? `あと${m}分` : `あと${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + "分" : ""}`; }
function pOf(r) { return r.p10k ?? r.p10k_final ?? null; }
// 左の大きい数字: 三連複が1万円以上になる確率。その数字が無いレースは判定の言葉
function pcBox(r) {
  const p = pOf(r);
  if (p != null) return `<span class="pc ${p >= 0.595 ? "rough" : p < 0.3 ? "calm" : "mute"}" title="三連複が1万円以上になる確率。1勝クラス以上の平均は36%"><b>${Math.round(p * 100)}</b><small>%</small></span>`;
  const j = r.judge_morning;
  return `<span class="pc word ${j && !r.debut ? (j.label === "荒れる" ? "rough" : "calm") : "mute"}">${r.debut ? "新馬" : j ? esc(j.label) : "—"}</span>`;
}
function byTime(rs) { return rs.slice().sort((a, b) => (postMin(a) - postMin(b)) || (a.rid < b.rid ? -1 : 1)); }

function renderYoso() {
  const v = $("v-yoso");
  if (!S.data) { v.innerHTML = `<p class="empty">予想のデータがまだありません。</p>`; return; }
  if (S.open) { renderRace(v, S.data.races.find(r => r.rid === S.open)); return; }
  const rs = byTime(S.data.races); const ck = clock(); const today = S.data.ds === ck.ds;
  const done = r => !!r.result || (today && postMin(r) < ck.hm);
  const next = today ? rs.find(r => !done(r)) : null;
  const hasP = rs.some(r => pOf(r) != null);
  let sort = "time"; try { sort = localStorage.getItem("keiba.sort") || "time"; } catch {}
  if (!hasP) sort = "time";
  const list = sort === "p" ? rs.slice().sort((a, b) => (done(a) - done(b)) || ((pOf(b) ?? -1) - (pOf(a) ?? -1))) : rs;
  const picks = rs.filter(r => !done(r) && (pOf(r) ?? 0) >= 0.595).sort((a, b) => pOf(b) - pOf(a));
  const dayBets = S.bets.filter(b => b.ds === S.data.ds);
  const dayCost = dayBets.reduce((s, b) => s + b.cost, 0);
  const settled = rs.filter(r => r.result && myBets(r).length);
  const dayRet = settled.reduce((s, r) => s + myBets(r).reduce((t, b) => t + (betReturn(r, b) || 0), 0), 0);
  const settledCost = settled.reduce((s, r) => s + myBets(r).reduce((t, b) => t + b.cost, 0), 0);
  v.innerHTML = `<div class="list">
    <div class="panel today">
      ${hasP ? `<div class="row"><span class="lab">狙い目（三連複1万円以上が 60%以上・これから走るレース）</span>
        ${picks.length ? `<div class="quick">${picks.map(r => `<button class="pickb" data-rid="${r.rid}"><b>${Math.round(pOf(r) * 100)}%</b> ${esc(r.place)}${r.r}R <small>${r.post}</small></button>`).join("")}</div>` : `<span class="note">いまは 60%以上のレースがありません。</span>`}</div>

// 1点ずつ買った三連複で、3着内の3頭が全部買った馬の中にいたのに組が抜けていたら知らせる
function leakOf(race, bt) {
  if (bt.kind !== "3連複" || !race?.result || bt.shape) return "";
  const used = new Set(bt.items.flatMap(it => it.c)); const top = race.result.top3;
  if (!top.every(n => used.has(n))) return "";
  if (bt.items.some(it => key("3連複", it.c) === key("3連複", top))) return "";
  return `漏れ: 3着内の ${[...top].sort((a, b) => a - b).join("-")} は3頭とも買った馬の中にいたのに、この組を買っていませんでした（三連複 ${yen(race.result.fuku3[0][1])}）`;
}

// ---- 貼り付け（投票サイトの購入履歴） ----
const KIND_RE = /^(3連複|3連単|馬連|馬単|ワイド|単勝|複勝|枠連|枠単)(的)?(フォーメーション|BOX|ボックス|通常|ながし|流し)?(?:(\d+)組)?/;
const PLACE_RE = /^確?\s*(札幌|函館|福島|新潟|東京|中山|中京|京都|阪神|小倉)\s*(\d+)R/;
const toYen = s => +String(s).replace(/[,円]/g, "");
const numsIn = l => /^[\d、,\s]+$/.test(l.trim()) ? (l.match(/\d+/g) || []).map(Number) : [];
function parseHistory(text) {
  const out = [];
  for (const blk of text.split(/^確\s*$/m)) {
    const lines = blk.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const head = lines.find(l => PLACE_RE.test(l)); if (!head) continue;
    const m = head.match(PLACE_RE);
    const race = { race: `${m[1]}${+m[2]}R`, title: head.replace(/^確\s*/, ""), tickets: [] };
    lines.forEach((l, i) => { if (l === "購入") race.buy = toYen(lines[i + 1]); if (l === "払戻") race.pay = toYen(lines[i + 1]); });
    let i = 0;
    while (i < lines.length) {
      const h = lines[i].match(KIND_RE);
      if (!h) { i++; continue; }
      const kind = h[1], way = h[3] || "通常";
      const need = (kind === "3連複" || kind === "3連単") ? 3 : (kind === "単勝" || kind === "複勝") ? 1 : 2;
      let j = i + 1; const t = { kind, way };
      if (way === "通常") {
        let ns = [];
        while (j < lines.length && ns.length < need && numsIn(lines[j]).length) { ns = ns.concat(numsIn(lines[j])); j++; }
        const money = lines.slice(j, j + 4).filter(x => /^[\d,]+円$/.test(x)).map(toYen);
        t.combos = [ns.slice(0, need)]; t.unit = money[0] ?? 100; t.pay = money[1] ?? 0;
      } else {
        const cols = {}; let cur = null;
        while (j < lines.length && !KIND_RE.test(lines[j])) {
          const l = lines[j]; const c = l.match(/^(1頭目|2頭目|3頭目|1着|2着|3着|軸|相手)$/);
          if (c) { cur = c[1]; cols[cur] = cols[cur] || []; }
          else if (numsIn(l).length) { const k = cur || "BOX"; cols[k] = (cols[k] || []).concat(numsIn(l)); }
          else if (/^\d+点計[\d,]+円$/.test(l)) { const pm = l.match(/^(\d+)点計([\d,]+)円$/); t.total = toYen(pm[2]); if (/^[\d,]+円$/.test(lines[j + 1] || "")) { t.pay = toYen(lines[j + 1]); j++; } j++; break; }
          else if (/^[\d,]+円$/.test(l) && Object.keys(cols).length) { t.pay = toYen(l); j++; break; }
          j++;
        }
        let combos = [];
        const comb = (arr, k) => { const r = []; const rec = (s, cur) => { if (cur.length === k) { r.push(cur); return; } for (let x = s; x < arr.length; x++) rec(x + 1, [...cur, arr[x]]); }; rec(0, []); return r; };
        if (way === "BOX" || way === "ボックス") combos = comb([...new Set(cols.BOX || [])].sort((a, b) => a - b), need);
        else if (cols["軸"]) { const ax = cols["軸"]; combos = comb((cols["相手"] || []).filter(x => !ax.includes(x)), need - ax.length).map(c => [...ax, ...c]); }
        else {
          const g = (cols["1頭目"] ? ["1頭目", "2頭目", "3頭目"] : ["1着", "2着", "3着"]).slice(0, need).map(k => cols[k] || []);
          const rec = (k, cur) => { if (k === need) { if (new Set(cur).size === need) combos.push(cur); return; } for (const n of g[k]) rec(k + 1, [...cur, n]); };
          rec(0, []);
        }
        if (UNORDERED.has(kind)) { const mp = new Map(); for (const c of combos) { const s = [...c].sort((a, b) => a - b); mp.set(s.join("-"), s); } combos = [...mp.values()]; }
        t.combos = combos; t.unit = Math.floor((t.total ?? race.buy ?? 0) / Math.max(1, combos.length)); t.pay = t.pay ?? 0;
        t.desc = way === "通常" ? "" : Object.entries(cols).map(([k, v]) => `${k} ${v.join(",")}`).join("／");
      }
      race.tickets.push(t); i = j;
    }
    out.push(race);
  }
  return out;
}

    <textarea id="hist" placeholder="確\n東京 6R\n購入\n5,800円\n払戻\n…">${esc(S.pasteText || "")}</textarea>
    <div class="quick"><button class="primary" id="read">読み取る</button><span class="status" id="pmsg"></span></div>
    ${p ? `<div class="tw"><table><thead><tr><th>R</th><th>券種</th><th class="r">点数</th><th class="r">購入</th><th class="r">払戻</th><th>確認</th></tr></thead><tbody>
      ${p.map(r => { const calc = r.tickets.reduce((s, t) => s + t.unit * t.combos.length, 0); const ok = calc === r.buy && S.data?.races.some(x => `${x.place}${x.r}R` === r.race);
        return `<tr><td>${esc(r.race)}</td><td>${[...new Set(r.tickets.map(t => t.kind + (t.way !== "通常" ? " " + t.way : "")))].map(esc).join("・")}</td><td class="r">${r.tickets.reduce((s, t) => s + t.combos.length, 0)}</td><td class="r">${yen(r.buy)}</td><td class="r">${yen(r.pay)}</td>
        <td>${ok ? "OK" : `<span class="warn">${calc !== r.buy ? "金額が合わない（読んだ " + yen(calc) + "）" : "この日に無いレース"}</span>`}</td></tr>`; }).join("")}
      </tbody></table></div>
      <div class="quick"><button class="primary" id="savep" ${S.dbOk ? "" : "disabled"}>${p.length}R分を記録</button><span class="status" id="pmsg2"></span></div>` : ""}
  </div>`;
  $("hist").oninput = e => { S.pasteText = e.target.value; };
  $("read").onclick = () => { S.parsed = parseHistory($("hist").value); if (!S.parsed.length) { $("pmsg").textContent = "レースが見つかりませんでした。「東京 6R」のような行が入っているか確かめてください。"; S.parsed = null; return; } render(); };
  const sp = $("savep"); if (sp) sp.onclick = async () => {
    sp.disabled = true; let n = 0;
    for (const r of S.parsed) {
      const meta = S.data?.races.find(x => `${x.place}${x.r}R` === r.race);
      const byKind = {};
      for (const t of r.tickets) (byKind[t.kind] = byKind[t.kind] || []).push(t);
      for (const [kind, ts] of Object.entries(byKind)) {
        const items = ts.flatMap(t => t.combos.map(c => ({ c, u: t.unit })));
        const ok = await saveBet({ ds: S.day, race: r.race, rid: meta?.rid || null, kind, source: "paste",
          desc: ts.map(t => t.way === "通常" ? "通常" : `${t.way} ${t.desc}`).filter((x, i, a) => a.indexOf(x) === i).join("／"),
          items, cost: items.reduce((s, it) => s + it.u, 0), pastedPay: ts.reduce((s, t) => s + (t.pay || 0), 0), savedAt: new Date().toISOString() });
        if (ok) n++;
      }
    }
    $("pmsg2").textContent = `${n}件を記録しました`; S.parsed = null; S.pasteText = "";
    setTimeout(render, 1200);
  };
}

// ---- 成績 ----
function renderSeiseki() {
  const v = $("v-seiseki");
  if (!S.dbOk) { v.innerHTML = `<p class="empty">記録の置き場所につながっていないので、成績を出せません。設定・QR で鍵を入れてください。</p>`; return; }
  if (!S.bets.length) { v.innerHTML = `<p class="empty">まだ記録がありません。予想タブでレースを開いて買い目を記録するか、貼り付けタブで購入履歴を貼ってください。</p>`; return; }
  const groups = new Map();
  for (const b of S.bets) { const k = b.ds + "|" + b.race; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(b); }
  const T = { n: 0, buy: 0, ret: 0, c3: 0, r3: 0, pop: 0, mark: 0, markC: 0, markMe: 0, model: 0, modelC: 0, modelMe: 0, kC: 0, kR: 0, pi: 0, p3: 0, m3: 0, nm: 0, pim: 0, wait: 0 };
  const rows = [];
  for (const [k, bs] of [...groups.entries()].sort()) {
    const [ds, rn] = k.split("|"); const race = findRace(ds, rn);
    const buy = bs.reduce((s, b) => s + b.cost, 0);
    if (!race?.result) { T.wait += buy; rows.push(`<tr><td>${esc(ds)}</td><td>${esc(rn)}</td><td class="r">${yen(buy)}</td><td colspan="5" class="note">結果待ち</td></tr>`); continue; }
    const ret = bs.reduce((s, b) => s + (betReturn(race, b) || 0), 0);
    T.n++; T.buy += buy; T.ret += ret;
    const c = compare(race, bs);
    if (c) {
      T.c3 += c.cost; T.r3 += c.me; T.pop += c.pop ?? 0;
      if (c.mark !== null) { T.mark += c.mark; T.markC += c.cost; T.markMe += c.me; }
      if (c.model !== null) { T.model += c.model; T.modelC += c.cost; T.modelMe += c.me; }
      if (c.k) { T.kC += c.k.cost; T.kR += c.k.ret; }
      T.pi += c.picksIn; T.p3 += c.pop3In; if (c.mark3In !== null) { T.nm++; T.m3 += c.mark3In; T.pim += c.picksIn; }
    }
    rows.push(`<tr><td>${esc(ds)}</td><td>${esc(rn)}</td><td class="r">${yen(buy)}</td><td class="r ${ret ? "res1" : ""}">${yen(ret)}</td>
      <td>${race.result.top3.join("-")}（${race.result.top3.map(n => race.result.ninki[n]).join("-")}）</td>
      <td>${c ? c.picks.join(" ") + "（" + c.picksIn + "頭）" : "-"}</td><td class="r">${c ? yen(c.pop) : "-"}</td><td class="r">${c && c.mark !== null ? yen(c.mark) : "-"}</td></tr>`);
  }
  v.innerHTML = `<div class="panel">
    <h2>通算</h2>
    <dl class="kpi">
      <div class="me"><dt>本人（全券種）</dt><dd>${pct(T.ret, T.buy)}<small>${yen(T.buy)} → ${yen(T.ret)}・${T.n}R</small></dd></div>
      <div><dt>人気版（同じ形の三連複）</dt><dd>${pct(T.pop, T.c3)}<small>本人の三連複 ${pct(T.r3, T.c3)}</small></dd></div>
      <div><dt>印版</dt><dd>${pct(T.mark, T.markC)}<small>同じレースの本人 ${pct(T.markMe, T.markC)}</small></dd></div>
      <div><dt>モデル版</dt><dd>${pct(T.model, T.modelC)}<small>同じレースの本人 ${pct(T.modelMe, T.modelC)}</small></dd></div>
      <div><dt>作業1の買い方</dt><dd>${pct(T.kR, T.kC)}<small>${yen(T.kC)} → ${yen(T.kR)}</small></dd></div>
    </dl>
    <p class="note">選んだ3頭（三連複で使った金額の多い3頭）が3着内に来た頭数: 本人 ${T.n ? (T.pi / T.n).toFixed(2) : "-"}頭／人気上位3頭 ${T.n ? (T.p3 / T.n).toFixed(2) : "-"}頭${T.nm ? `／印の上位3頭 ${(T.m3 / T.nm).toFixed(2)}頭（同じ${T.nm}Rで本人 ${(T.pim / T.nm).toFixed(2)}頭）` : ""}${T.wait ? `。結果待ち ${yen(T.wait)}` : ""}</p>
    <p class="note">人気版・印版・モデル版は、本人が使った馬を使った金額の多い順に、1番人気・2番人気…（印なら◎○▲…）へ置き換えた同じ形の三連複。人気は確定オッズの順。差がはっきりするには数百R要ります。</p>
  </div>
  <div class="panel"><h2>レースごと</h2><div class="tw"><table><thead><tr><th>日付</th><th>R</th><th class="r">購入</th><th class="r">払戻</th><th>1-2-3着（人気）</th><th>選んだ3頭</th><th class="r">人気版</th><th class="r">印版</th></tr></thead>
    <tbody>${rows.join("")}</tbody></table></div></div>`;
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!cfg()?.token) { $("dbstate").hidden = true; S.tab = "setup"; render(); }
else { loadDays().then(loadBets); }
</script>
